[package]
name = "eventflow"
version = "1.0.0"
description = "EventFlow — AI Operating System for Events"
authors = ["NORTHSTONE HOLDING"]
edition = "2021"

[lib]
name = "eventflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
